<!DOCTYPE html>
<html lang="fr" data-gamme="__GAMME__">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNAPSE — Champ de confiance</title>
<link rel="icon" href="/v/__VERSION__/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/v/__VERSION__/vendor/polices.css">
<link rel="stylesheet" href="/v/__VERSION__/ecrans.css">
<style>
/* Le champ de confiance en direct (4.3.4), sur le modèle « mono ». Tout ce que
   le tamis voit passer : chaque écriture, à la hauteur de son importance, face
   au seuil réel de son commun ; pleine si elle monte, creuse si elle reste
   rangée. Chaque source est un ruban, sa moyenne glissante. Le temps défile :
   à droite, maintenant ; à gauche, il y a quinze minutes. Les questions posées
   s'y inscrivent à leur heure. */
:root{--acc:#ffffff;--panel:#000;--line:rgba(255,255,255,.22)}
html,body{background:#000}
.ecran{grid-template-rows:auto 1fr 210px}
.tete{border-bottom:1px solid var(--line);padding-bottom:5px}
#haut{display:flex;gap:28px;align-items:baseline;margin-left:14px}
#haut div{font-size:12px;color:var(--mut)}
#haut b{display:block;font-family:var(--mono);font-size:16px;color:var(--txt);font-weight:500}
#haut i{font-style:normal;color:#fff}
#mil{display:grid;grid-template-columns:1fr 330px;min-height:0;border:1px solid var(--line)}
#champ{background:#000;border-right:1px solid var(--line)}
.co{position:absolute;background:#000;border:1px solid #fff;color:#fff;font-size:12.5px;padding:6px 11px;white-space:nowrap;pointer-events:none;font-weight:600}
.co.blanc{background:#fff;color:#000}
.co small{display:block;font-size:9px;font-weight:400;color:#aaa;margin-top:3px;border-top:1px solid #444;padding-top:3px}
.co.blanc small{color:#444;border-color:#bbb}
.mire{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);pointer-events:none;
  background:linear-gradient(#fff,#fff) 0 0/8px 1.5px no-repeat,linear-gradient(#fff,#fff) 0 0/1.5px 8px no-repeat,linear-gradient(#fff,#fff) 100% 0/8px 1.5px no-repeat,linear-gradient(#fff,#fff) 100% 0/1.5px 8px no-repeat,
  linear-gradient(#fff,#fff) 0 100%/8px 1.5px no-repeat,linear-gradient(#fff,#fff) 0 100%/1.5px 8px no-repeat,linear-gradient(#fff,#fff) 100% 100%/8px 1.5px no-repeat,linear-gradient(#fff,#fff) 100% 100%/1.5px 8px no-repeat}
#droite{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#tetes{padding:10px 12px;font-size:12px;color:var(--mut)}
.soustitre{font-size:12px;color:var(--mut);padding:0 12px}
#tetes .g{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:3px;margin-bottom:3px}
#tetes .c{border:1px solid #333;padding:4px 6px;color:#fff;font-family:var(--mono);font-size:11px;display:flex;flex-direction:column;gap:2px;overflow:hidden;white-space:nowrap}
#tetes .c span{color:var(--dim);font-family:var(--sans);font-size:10.5px}
#tetes .c i{display:block;height:3px;background:#222}#tetes .c i b{display:block;height:100%;background:#fff}
#tours{flex:1;display:flex;gap:8px;align-items:flex-end;padding:6px 12px 18px;min-height:0}
#tours .t{flex:1;display:flex;flex-direction:column-reverse;gap:2px;position:relative;height:100%}
#tours .t i{display:block;height:5px;background:#fff}
#tours .t i.o{background:transparent;outline:1px solid #777}
#tours .t u{position:absolute;left:-4px;right:-4px;height:2px;background:#fff}
#tours .t em{position:absolute;bottom:-14px;left:-6px;right:-6px;text-align:center;font-style:normal;font-size:8px;color:#888;overflow:hidden;white-space:nowrap}
#bas{display:grid;grid-template-columns:1fr 1.3fr;border:1px solid var(--line);min-height:0}
#bas .p{border:0;border-right:1px solid var(--line);border-radius:0;background:#000;padding:7px 9px}
#bas .p h4{color:var(--txt);font-weight:600}
#code{font-family:var(--mono);font-size:11.5px;line-height:1.5;color:#ccc;white-space:pre;overflow:hidden}
#code b{background:#fff;color:#000;font-weight:400;display:block}
#route div{display:grid;grid-template-columns:70px 1fr 40px 110px;gap:8px;font-size:12px;padding:1px 3px;white-space:nowrap}
#route div span{overflow:hidden;text-overflow:ellipsis}#route div em{font-style:normal;text-align:right}
#route div.m{background:#fff;color:#000}
#grille{display:grid;gap:1px;flex:1}
#grille i{display:block}
#grilleL{display:flex;justify-content:space-between;font-size:8px;color:#777;margin-top:3px}
</style>
</head>
<body>
<div class="ecran">
  <header class="tete"><span class="marque">SYNAPSE <b>/</b> Confiance</span>
    <div id="haut"><div>écritures / min<b id="mDeb">—</b></div><div>montées · 15 min<b id="mMon">—</b></div><div>seuils<b id="mSeuil">—</b></div><div>questions · 24 h<b id="mQ">—</b></div><div>en direct<b id="mN">—</b></div></div>
    <nav class="onglets" id="nav"></nav></header>
  <section id="mil">
    <div class="scene" id="champ"><canvas id="cv"></canvas></div>
    <div id="droite">
      <div id="tetes"><div style="display:flex;justify-content:space-between;margin-bottom:4px;color:#fff"><span>Sources · 15 dernières minutes</span><span id="tq">—</span></div><div id="sources"></div></div>
      <div class="soustitre">Importance par source, et seuil de son commun</div>
      <div id="tours"></div>
    </div>
  </section>
  <section id="bas">
    <div class="p"><h4>Dernière décision <span id="codeH">—</span></h4><div id="code"></div></div>
    <div class="p"><h4>Routeur du tamis <span>en direct</span></h4><div id="route"></div></div>
  </section>
</div>
<script src="/v/__VERSION__/ecrans.js" nonce="__NONCE__"></script>
<script nonce="__NONCE__">
'use strict';
const {$,esc,fmtMs,fmtN,heure,api,ajuster,hash01}=ECRAN;
ECRAN.onglets($('#nav'));
const FEN_MAX=15*60000,FEN_MIN=3*60000;   /* la fenêtre : le temps couvert par les données, entre 3 et 15 minutes */
let FEN=FEN_MAX;
const S={H:null,ev:[],questions:[],debit:0,parId:new Map(),dernier:null,seuilDe:new Map()};
const DEC={faite:'monte',a_valider:'attend',refusee:'refusée',rangee:'rangée',repetition:'répété'};

/* le seuil qui compte pour une écriture : celui du commun au-dessus de son cerveau */
function seuils(H){
  for(const d of H.domaines)for(const m of d.membres||[])S.seuilDe.set(m.id,{seuil:(d.commun.reglages||{}).seuil,commun:d.nom,remontee:(d.commun.reglages||{}).remontee});
}
function ajouter(e){
  if(S.parId.has(e.id)){Object.assign(S.parId.get(e.id),e);return;}
  S.ev.push(e);S.parId.set(e.id,e);
}
async function charger(){
  const [H,r,st]=await Promise.all([ECRAN.hierarchie(),api('/v1/tamis/recent?ns=shared&minutes=15'),api('/v1/stats?scope=activite')]);
  S.H=H;seuils(H);
  for(const x of r.evenements)ajouter({id:x.id,t:Date.parse(x.t),source:x.source,genre:x.genre,cerveau:x.cerveau,importance:x.importance,decision:x.statut||'rangee',vers:x.vers,regle:x.regle});
  /* les motifs répétés ne sont pas gardés en base, entrée par entrée : seul le direct les dit */
  const a=st.activite||{};$('#mQ').textContent=fmtN(a.requetes_24h);
  for(const q of a.serie||[]){const t=Date.parse(q.t);if(Date.now()-t<FEN)S.questions.push({t,route:q.route,arret:q.arret,ms:q.ms,source:q.source});}
  const vals=[...new Set([...S.seuilDe.values()].map(v=>v.seuil))].filter(v=>v!=null).sort((a,b)=>a-b);
  $('#mSeuil').textContent=vals.length?vals.join(' · '):'—';
  if(S.ev.length)S.dernier=S.ev[S.ev.length-1];
  panneaux();
}

/* ---- le champ, redessiné dix fois par seconde : le temps y passe vraiment ---- */
function dessiner(){
  const sc=$('#champ'),{g,W,H}=ajuster($('#cv'));g.fillStyle='#000';g.fillRect(0,0,W,H);
  const now0=Date.now(),plusVieux=S.ev.reduce((m,e)=>Math.min(m,e.t),now0);FEN=Math.max(FEN_MIN,Math.min(FEN_MAX,now0-plusVieux));
  const now=now0,top=22,bot=H-16,axeX=W-46,X=t=>18+(axeX-36)*(1-(now-t)/FEN),Y=v=>bot-(bot-top)*Math.max(0,Math.min(100,v))/100;
  const ev=S.ev.filter(e=>now-e.t<FEN);
  if(!ev.length&&!S.questions.length){g.fillStyle='#777';g.font='14px monospace';g.fillText('aucune écriture depuis 15 minutes : le tamis attend',40,H/2);return;}
  /* le champ de grain : chaque écriture laisse une poussière à sa hauteur */
  for(const e of ev){const x=X(e.t),y=Y(e.importance);for(let k=0;k<10;k++){const j=hash01(e.id*31+k),kk=hash01(e.id*17+k*3);
    g.fillStyle=`rgba(255,255,255,${.04+.08*j})`;g.fillRect(x+30+kk*90,y+(j-.5)*30,1.3,1.3);}}
  /* les rubans : la moyenne glissante de l'importance de chaque source, les quatre plus actives */
  const par={};for(const e of ev)(par[e.source]=par[e.source]||[]).push(e);
  const tops=Object.entries(par).sort((a,b)=>b[1].length-a[1].length).slice(0,4);
  tops.forEach(([src,l],r)=>{const pas=20000,pts=[];
    for(let t=now-FEN;t<=now;t+=pas){const d=l.filter(e=>e.t>t-60000&&e.t<=t);if(!d.length)continue;pts.push([X(t),Y(d.reduce((s,e)=>s+e.importance,0)/d.length)]);}
    if(pts.length<2)return;const larg=14+r*3,dec=40+r*larg*1.2;
    g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y-dec*.0+r*0):g.moveTo(x,y));for(let i=pts.length-1;i>=0;i--)g.lineTo(pts[i][0],pts[i][1]+larg);g.closePath();
    const gr=g.createLinearGradient(0,0,0,larg);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#666');
    g.fillStyle=`rgba(${230-r*35},${230-r*35},${230-r*35},.85)`;g.fill();g.strokeStyle='#000';g.lineWidth=3;g.stroke();
    for(let k=1;k<4;k++){g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1;g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y+larg*k/4):g.moveTo(x,y+larg*k/4));g.stroke();}
    const [lx,ly]=pts[pts.length-1];g.fillStyle='#fff';g.font='10px "JetBrains Mono",monospace';g.fillText(src,Math.min(lx+6,axeX-80),ly+larg/2+3);});
  /* les écritures : des carrés ; pleins si elles montent ou attendent, creux si elles restent rangées */
  for(const e of ev){const x=X(e.t),y=Y(e.importance),monte=e.decision==='faite'||e.decision==='a_valider',n=2+Math.round(e.importance/22);
    for(let k=0;k<n;k++){const a=hash01(e.id*13+k),b=hash01(e.id*29+k*5),sz=2+a*a*(monte?8:5),px=x-a*16,py=y+(b-.5)*14;
      g.globalAlpha=.4+.6*(1-(now-e.t)/FEN);if(monte){g.fillStyle='#fff';g.fillRect(px,py,sz,sz);}else{g.strokeStyle='#fff';g.lineWidth=1;g.strokeRect(px,py,sz,sz);}}}
  g.globalAlpha=1;
  /* les questions posées, à leur heure */
  const qs=S.questions.filter(q=>now-q.t<=FEN);
  qs.forEach((q,i)=>{const x=X(q.t);g.strokeStyle='rgba(255,255,255,.35)';g.setLineDash([2,4]);g.beginPath();g.moveTo(x,top);g.lineTo(x,bot);g.stroke();g.setLineDash([]);
    /* seule la plus récente garde son texte : plusieurs questions rapprochées se chevauchaient */
    if(i===qs.length-1){g.fillStyle='#e8e6e1';g.font='11px "JetBrains Mono",monospace';const t='question · '+q.arret+' · '+fmtMs(q.ms);g.fillText(t,Math.min(x+4,axeX-g.measureText(t).width-24),top+12);}});
  /* l'axe de l'importance, à droite */
  g.fillStyle='#bbb';g.font='11px "JetBrains Mono",monospace';g.strokeStyle='#666';
  for(let k=0;k<=10;k++){const y=Y(k*10);g.beginPath();g.moveTo(axeX-14,y);g.lineTo(axeX-6,y);g.stroke();g.fillText((k/10).toFixed(1),axeX,y+4);}
  g.fillStyle='#8a867e';g.font='11px "JetBrains Mono",monospace';g.fillText('−'+Math.round(FEN/60000)+' min',18,bot+12);g.fillText('maintenant',axeX-80,bot+12);
  /* les vrais seuils des communs */
  const vus=new Map();for(const v of S.seuilDe.values())if(v.seuil!=null&&v.seuil<=100){if(!vus.has(v.seuil))vus.set(v.seuil,[]);if(!vus.get(v.seuil).includes(v.commun))vus.get(v.seuil).push(v.commun);}
  for(const [s] of vus){const y=Y(s);g.setLineDash([6,6]);g.strokeStyle='rgba(255,255,255,.7)';g.beginPath();g.moveTo(18,y);g.lineTo(axeX-18,y);g.stroke();g.setLineDash([]);}
  if((performance.now()-(S.tEt||0))>600){S.tEt=performance.now();etiquettes(sc,W,H,X,Y,vus,ev,axeX);}
}
function etiquettes(sc,W,H,X,Y,vus,ev,axeX){
  sc.querySelectorAll('.co,.mire').forEach(e=>e.remove());
  const co=(html,x,y,cls)=>{const d=document.createElement('div');d.className='co '+(cls||'');d.innerHTML=html;d.style.left=x+'px';d.style.top=y+'px';sc.appendChild(d);};
  const mire=(x,y)=>{const m=document.createElement('div');m.className='mire';m.style.left=x+'px';m.style.top=y+'px';sc.appendChild(m);};
  let i=0;for(const [s,coms] of vus){co('Seuil '+(s/100).toFixed(2)+'<small>'+esc(coms.join(' · '))+' : au-dessus, l’entrée monte</small>',W*.42+i*190,Y(s)-46,'blanc');i++;}
  if(!vus.size)co('Aucun seuil d’importance<small>les communs ne font monter que par étiquette</small>',W*.42,40,'blanc');
  const m=[...ev].reverse().find(e=>e.decision==='faite'||e.decision==='a_valider');
  if(m){const x=X(m.t),y=Y(m.importance);mire(x-6,y+4);const c=S.H&&S.H.cerveaux.get(m.vers);
    co('→ '+esc(m.source)+' · '+esc(m.genre)+' · '+(m.importance/100).toFixed(2)+'<small>'+(m.decision==='a_valider'?'attend un geste humain':'monte vers '+esc(c?c.nom:'son commun'))+' · règle '+esc(m.regle||'—')+'</small>',Math.max(20,Math.min(x-260,W-420)),Math.max(30,y-60),'blanc');}

}
/* ---- les panneaux, deux fois par seconde au plus ---- */
const panneaux=ECRAN.limiter(()=>{
  const now=Date.now(),ev=S.ev.filter(e=>now-e.t<FEN);
  $('#mN').textContent=fmtN(ev.length)+' écritures';$('#mMon').textContent=fmtN(ev.filter(e=>e.decision==='faite'||e.decision==='a_valider').length);
  const par={};for(const e of ev)(par[e.source]=par[e.source]||[]).push(e);const L=Object.entries(par).sort((a,b)=>b[1].length-a[1].length);
  $('#tq').textContent=L.length+' sources';const mx=Math.max(1,...L.map(l=>l[1].length));
  $('#sources').innerHTML=L.slice(0,8).map(([s,l])=>{const moy=l.reduce((a,e)=>a+e.importance,0)/l.length,mt=l.filter(e=>e.decision==='faite'||e.decision==='a_valider').length;
    return '<div class="g"><div class="c"><span>source</span>'+esc(s)+'<i><b style="width:'+(100*l.length/mx)+'%"></b></i></div><div class="c"><span>écrit</span>'+fmtN(l.length)+'</div><div class="c"><span>imp. moy.</span>'+Math.round(moy)+'<i><b style="width:'+moy+'%"></b></i></div><div class="c"><span>montées</span>'+mt+'</div></div>';}).join('')||'<div class="vide">aucune écriture depuis 15 min</div>';
  /* tours : la répartition de l'importance de chaque source, par dizaine, et le seuil de son commun */
  $('#tours').innerHTML=L.slice(0,6).map(([s,l])=>{const b=new Array(10).fill(0);for(const e of l)b[Math.min(9,Math.floor(e.importance/10))]++;
    const se=(S.seuilDe.get(l[0].cerveau)||{}).seuil;return '<div class="t">'+b.map((n,i)=>'<i class="'+(n?'':'o')+'" title="'+(i*10)+'–'+(i*10+9)+' : '+n+'"></i>').join('')+(se!=null&&se<=100?'<u style="bottom:'+se+'%"></u>':'')+'<em>'+esc(s)+'</em></div>';}).join('');
  /* le routeur : les dernières décisions */
  $('#route').innerHTML=[...ev].reverse().slice(0,9).map(e=>'<div class="'+(e.decision==='faite'||e.decision==='a_valider'?'m':'')+'"><em style="text-align:left">'+heure(e.t)+'</em><span>'+esc(e.source)+' · '+esc(e.genre)+'</span><em>'+e.importance+'</em><em>'+DEC[e.decision]+'</em></div>').join('')||'<div class="vide">en attente d’écritures…</div>';
  /* la dernière décision, comme une trace */
  const d=S.dernier;if(d){const c2=S.H&&S.H.cerveaux.get(d.cerveau),se=S.seuilDe.get(d.cerveau)||{};$('#codeH').textContent=heure(d.t);
    const L2=['// écriture #'+d.id,'source     = '+d.source,'genre      = '+d.genre,'cerveau    = '+(c2?c2.nom:'#'+d.cerveau),'importance = '+d.importance,'seuil      = '+(se.seuil??'—')+'   // commun '+(se.commun||'—'),
      'décision   = '+DEC[d.decision]+(d.regle?'   // règle '+d.regle:''),'écart      = '+(se.seuil!=null?(d.importance-se.seuil):'—')];
    $('#code').innerHTML=L2.map((l,i)=>i===6?'<b>'+esc(l)+'</b>':esc(l)).join('\n');}
},500);
/* ---- le direct ---- */
ECRAN.flux({
  evenement:e=>{
    if(e.type==='ecrit'){const x={id:e.id,t:e.t?Date.parse(e.t)||Date.now():Date.now(),source:e.source,genre:e.genre,cerveau:e.cerveau,importance:e.importance??0,decision:'rangee'};ajouter(x);S.dernier=x;}
    else if(e.type==='tamis'&&e.entree&&e.decision!=='fiche'){const x=S.parId.get(e.entree);if(x){x.decision=e.decision==='remontee'?'faite':e.decision;x.vers=e.vers;x.regle=e.regle;}}
    else if(e.type==='question')S.questions.push({t:Date.now(),route:e.route,arret:e.arret,ms:e.ms,source:e.source});
    if(S.ev.length>6000){const now=Date.now();S.ev=S.ev.filter(v=>now-v.t<FEN_MAX);S.parId=new Map(S.ev.map(v=>[v.id,v]));}
    panneaux();},
  etat:d=>{S.debit=Object.values(d.debit_60s||{}).reduce((a,b)=>a+b,0);$('#mDeb').textContent=fmtN(S.debit);panneaux();}
});
setInterval(dessiner,100);
addEventListener('resize',dessiner);
charger().then(dessiner).catch(e=>{$('#code').textContent='données illisibles : '+e.message;});
</script>
</body>
</html>
