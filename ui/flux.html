<!DOCTYPE html>
<html lang="fr" data-gamme="__GAMME__">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNAPSE — Flux</title>
<link rel="icon" href="/v/__VERSION__/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/v/__VERSION__/vendor/polices.css">
<link rel="stylesheet" href="/v/__VERSION__/ecrans.css">
<style>
/* Le flux (v4.3). La courbe des écritures cumulées sur 30 jours, faite de
   particules : chacune est une part réelle des écritures, à la couleur de
   sa source. Une écriture qui arrive s'ajoute en tête de la courbe. */
:root{--acc:#7dff6a;--panel:rgba(6,12,6,.9);--line:rgba(125,255,106,.14)}
body{background:#030503}
.ecran{grid-template-columns:270px 1fr;grid-template-rows:auto 1fr 230px}
.tete{grid-column:1/3}
#gauche{grid-row:2/4;display:grid;grid-template-rows:auto 1fr auto auto;gap:8px;min-height:0}
#etiq{background:var(--acc);color:#031003;font-weight:700;letter-spacing:.14em;text-align:center;padding:7px;border-radius:4px;font-size:12px}
#ag{font-size:9.5px}
#ag div{display:grid;grid-template-columns:1fr 54px 40px;gap:6px;align-items:center;padding:2px 0}
#ag div b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ag div i{font-style:normal;font-size:8px;text-align:center;border-radius:2px;padding:1px 0;color:#031003}
#ag div em{font-style:normal;text-align:right;color:var(--acc)}
#tot{font-size:20px;color:var(--acc);text-align:right}
#tot small{display:block;font-size:10px;color:var(--mut)}
#bas{display:grid;grid-template-columns:1.2fr 1fr 1.3fr;gap:8px;min-height:0}
.hm{display:grid;gap:2px}
.hm i{display:block;height:11px;border-radius:1px}
.hm span{font-size:8.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="ecran">
  <header class="tete"><span class="marque">SYNAPSE <b>/</b> FLUX</span><span class="chaine">les sources écrivent <i>·</i> la mémoire grossit <i>·</i> 30 jours</span><nav class="onglets" id="nav"></nav></header>
  <aside id="gauche">
    <div id="etiq">FLUX · 30 JOURS</div>
    <div class="p"><h4>SOURCES <span id="agN">—</span></h4><div id="ag"></div></div>
    <div class="p"><div id="tot">—<small>écritures sur 30 jours</small></div></div>
    <div class="p"><h4>JOURNAL</h4><div class="log" id="log"><div class="vide">en attente…</div></div></div>
  </aside>
  <section class="scene" id="scene"><canvas id="cv"></canvas></section>
  <section id="bas">
    <div class="p"><h4>SOURCE × JOUR <span>écritures</span></h4><div class="hm" id="hm"></div></div>
    <div class="p"><h4>PART DE CHAQUE SOURCE <span>30 jours</span></h4><div id="part"></div></div>
    <div class="p"><h4>DÉBIT EN DIRECT <span id="debN">—</span></h4><canvas id="deb" width="500" height="160"></canvas></div>
  </section>
</div>
<script src="/v/__VERSION__/ecrans.js" nonce="__NONCE__"></script>
<script nonce="__NONCE__">
'use strict';
const {$,esc,fmtN,heure,api,ajuster,hash01}=ECRAN;
ECRAN.onglets($('#nav'));
const S={hist:[],vu:{},tete:[]};
async function charger(){
  let [H,ch,src]=await Promise.all([ECRAN.hierarchie(),api('/v1/stats?scope=chronologie&days=30'),api('/v1/stats?scope=sources')]);
  /* peu de jours d'historique : la même courbe, heure par heure */
  if(new Set(ch.lignes.map(l=>l.jour)).size<4){ch=await api('/v1/stats?scope=chronologie&days=3&pas=heure');$('#etiq').textContent='FLUX · HEURE PAR HEURE';}
  Object.assign(S,{H,ch,src:src.sources||[]});
  const jours=[...new Set(ch.lignes.map(l=>l.jour))].sort(),sources=[...new Set(ch.lignes.map(l=>l.source))];
  const n=(j,s)=>(ch.lignes.find(l=>l.jour===j&&l.source===s)||{}).n||0;
  S.jours=jours;S.sources=sources;S.n=n;
  /* le cumul jour par jour, et la part de chaque source dans chaque jour */
  let cum=0;S.cum=jours.map(j=>{const parSrc=sources.map(s=>[s,n(j,s)]);cum+=parSrc.reduce((x,v)=>x+v[1],0);return {j,cum,parSrc};});
  $('#tot').firstChild.textContent=fmtN(cum)+' ';$('#tot').querySelector('small').textContent=ch.pas==='heure'?'écritures sur 3 jours, par heure':'écritures sur 30 jours';
  const tot=sources.map(s=>[s,jours.reduce((x,j)=>x+n(j,s),0)]).sort((a,b)=>b[1]-a[1]);
  $('#part').innerHTML=ECRAN.barres(tot.slice(0,8).map(([s,v])=>[s,v,ECRAN.couleurSource(H,s),Math.round(100*v/Math.max(1,cum))+' %']),tot[0]?tot[0][1]:1);
  /* grille source × jour */
  const top=tot.slice(0,8).map(t=>t[0]),mx=Math.max(1,...ch.lignes.map(l=>l.n));
  $('#hm').style.gridTemplateColumns='70px repeat('+jours.length+',1fr)';
  $('#hm').innerHTML=top.map(s=>'<span>'+esc(s)+'</span>'+jours.map(j=>{const v=n(j,s);return '<i title="'+j+' · '+v+'" style="background:'+(v?ECRAN.couleurSource(H,s):'rgba(255,255,255,.04)')+';opacity:'+(v?.25+.75*Math.log10(1+v)/Math.log10(1+mx):1)+'"></i>';}).join('')).join('');
  agents();particules();
}
function agents(){
  const now=Date.now();
  $('#agN').textContent=S.src.length+' · '+S.src.filter(s=>S.vu[s.source]&&now-S.vu[s.source]<60000).length+' actives';
  $('#ag').innerHTML=S.src.slice().sort((a,b)=>b.total-a.total).slice(0,16).map(s=>{const actif=S.vu[s.source]&&now-S.vu[s.source]<60000;
    return '<div><b style="color:'+ECRAN.couleurSource(S.H,s.source)+'">'+esc(s.source)+'</b><i style="background:'+(actif?'#7dff6a':'#2a3a2a')+';color:'+(actif?'#031003':'#7a8a7a')+'">'+(actif?'ACTIVE':'calme')+'</i><em>'+fmtN(s.jour||0)+'</em></div>';}).join('');
}
/* les particules : chaque jour, sa hauteur cumulée ; chaque source y met des grains à proportion de ce qu'elle a écrit */
function particules(){
  const P=[];const fin=S.cum.length?S.cum[S.cum.length-1].cum:1;
  S.cum.forEach((d,i)=>{let base=d.cum-d.parSrc.reduce((x,v)=>x+v[1],0);for(const [s,v] of d.parSrc){const g=Math.min(260,Math.ceil(Math.sqrt(v)*6));
    for(let k=0;k<g;k++){const f=(k+.5)/g;P.push({u:(i+hash01(i*97+k)*.98)/Math.max(1,S.cum.length),y:(base+v*f)/fin,s,dy:(hash01(k*13+i)-.5)});}base+=v;}});
  S.P=P;S.fin=fin;
}
function dessiner(){
  const {g,W,H}=ajuster($('#cv'));g.clearRect(0,0,W,H);
  if(!S.P||!S.P.length){g.fillStyle='#3a4a3a';g.font='14px monospace';g.fillText('aucune écriture sur 30 jours',40,H/2);requestAnimationFrame(dessiner);return;}
  const pad=40,X=u=>pad+(W-2*pad)*u,Y=v=>H-pad-(H-2*pad)*v;
  g.strokeStyle='rgba(125,255,106,.12)';g.beginPath();g.moveTo(pad,H-pad);g.lineTo(W-pad,H-pad);g.stroke();
  g.fillStyle='rgba(125,255,106,.5)';g.font='11px monospace';g.fillText(S.jours[0]||'',pad,H-pad+16);g.fillText(S.jours[S.jours.length-1]||'',W-pad-80,H-pad+16);g.fillText(fmtN(S.fin)+' écritures',W-pad-120,pad-10);
  g.globalCompositeOperation='lighter';
  for(const p of S.P){const x=X(p.u),y=Y(p.y)+p.dy*14*(1-p.y)+p.dy*4;g.fillStyle=ECRAN.couleurSource(S.H,p.s);g.globalAlpha=.55;g.fillRect(x,y,1.8,1.8);}
  /* la crête : la vraie courbe cumulée */
  g.globalAlpha=1;g.strokeStyle='#7dff6a';g.lineWidth=2;g.shadowColor='#7dff6a';g.shadowBlur=14;g.beginPath();
  S.cum.forEach((d,i)=>{const x=X((i+1)/S.cum.length),y=Y(d.cum/S.fin);i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();g.shadowBlur=0;
  /* les écritures arrivées depuis l'ouverture, en tête de la courbe */
  for(let i=S.tete.length-1;i>=0;i--){const t=S.tete[i];t.k+=.02;if(t.k>=1){S.tete.splice(i,1);continue;}
    const x=X(1)-30*(1-t.k)+t.dx,y=Y(1)+t.dy*(1-t.k)*40,gr=g.createRadialGradient(x,y,0,x,y,9);gr.addColorStop(0,'#fff');gr.addColorStop(.4,t.c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,9,0,7);g.fill();}
  g.globalCompositeOperation='source-over';requestAnimationFrame(dessiner);
}
ECRAN.flux({
  evenement:e=>{if(e.type!=='ecrit')return;S.vu[e.source]=Date.now();S.tete.push({k:0,c:S.H?ECRAN.couleurSource(S.H,e.source):'#7dff6a',dx:(hash01(e.id)-.5)*20,dy:hash01(e.id*3)});
    ECRAN.journal($('#log'),e.source+' → '+(e.genre||''),'#'+e.id,9);},
  etat:d=>{const t=Object.values(d.debit_60s||{}).reduce((a,b)=>a+b,0);S.hist.push(t);if(S.hist.length>72)S.hist.shift();$('#debN').textContent=fmtN(t)+' / min';
    ECRAN.spark($('#deb'),S.hist,'#7dff6a',{vide:'mesure dans 5 s'});if(S.src)agents();}
});
charger().then(()=>requestAnimationFrame(dessiner)).catch(e=>{$('#log').textContent='données illisibles : '+e.message;});
</script>
</body>
</html>
