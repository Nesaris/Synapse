<!DOCTYPE html>
<html lang="fr" data-gamme="__GAMME__">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNAPSE — Moteur orbital</title>
<link rel="icon" href="/v/__VERSION__/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/v/__VERSION__/vendor/polices.css">
<link rel="stylesheet" href="/v/__VERSION__/ecrans.css">
<style>
/* Le moteur orbital (v4.3). Le disque : chaque cerveau est une orbite,
   chaque point une entrée réelle, la plus récente la plus brillante ; le
   noyau au centre. Une entrée qui arrive spirale jusqu'à son orbite. */
:root{--acc:#ff4fa3;--panel:rgba(26,8,18,.9);--line:rgba(255,79,163,.18)}
body{background:radial-gradient(ellipse at 50% 45%,#2a0b1d 0%,#0b0408 70%)}
.ecran{grid-template-rows:auto 64px 1fr 150px 60px}
#acteurs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px}
.act h5{margin:0;font-size:8.5px;letter-spacing:.16em;color:var(--mut);grid-column:1/3;display:flex;justify-content:space-between}
.act h5 b{background:var(--acc);color:#fff;font-weight:600;padding:1px 5px;border-radius:3px;font-size:7.5px}
.act canvas{width:100%;height:24px}
.act em{font-style:normal;font-size:14px;color:#fff}
#mil{display:grid;grid-template-columns:230px 1fr 250px;gap:9px;min-height:0}
.col{display:grid;gap:8px;min-height:0}
.call{position:absolute;background:rgba(20,6,14,.88);border:1px solid rgba(255,79,163,.55);color:#fff;font-size:10px;padding:6px 9px;border-radius:5px;letter-spacing:.06em;pointer-events:none;white-space:nowrap}
.call small{display:block;color:#ffb3d6;font-size:8.5px}
.coeur{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:9px;letter-spacing:.24em;color:#fff;pointer-events:none}
#mat{display:grid;gap:3px}
#mat i{display:block;height:14px;border-radius:2px}
#jauge{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}
#bas{display:grid;grid-template-columns:1.1fr 1fr;gap:9px;min-height:0}
#regles{font-size:10px;line-height:1.6;color:var(--txt)}
#regles b{color:#ffb3d6;font-weight:400}
#chiffres{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
#chiffres .p{justify-content:center}
#chiffres .v{font-size:20px}
</style>
</head>
<body>
<div class="ecran">
  <header class="tete"><span class="marque">SYNAPSE <b>/</b> MOTEUR ORBITAL</span><span class="chaine">OBSERVER <i>·</i> RANGER <i>·</i> REMONTER <i>·</i> RÉPONDRE</span><nav class="onglets" id="nav"></nav></header>
  <section id="acteurs"></section>
  <section id="mil">
    <div class="col" style="grid-template-rows:1fr 1fr">
      <div class="p"><h4>SOURCES · 60 S <span>écritures</span></h4><div id="srcs"></div></div>
      <div class="p"><h4>CERVEAUX <span>entrées</span></h4><canvas id="cerv" width="400" height="200"></canvas></div>
    </div>
    <div class="scene" id="scene"><canvas id="cv"></canvas><div class="coeur">NOYAU</div></div>
    <div class="col" style="grid-template-rows:1.1fr 1fr .9fr">
      <div class="p"><h4>MATRICE DES DÉCISIONS <span>source × statut</span></h4><div id="mat"></div></div>
      <div class="p"><h4>REMONTÉES <span>par cerveau d’arrivée</span></h4><div id="rem"></div></div>
      <div class="p"><h4>FILE DE VECTORISATION</h4><div id="jauge"><canvas id="jg" width="220" height="120"></canvas><div class="s" id="jgS">—</div></div></div>
    </div>
  </section>
  <section id="bas">
    <div class="p"><h4>RÈGLES DU TAMIS <span>réglages réels du global</span></h4><div id="regles"></div></div>
    <div class="p"><h4>JOURNAL EN DIRECT <span>tout</span></h4><div class="log" id="log"><div class="vide">en attente…</div></div></div>
  </section>
  <section id="chiffres"></section>
</div>
<script src="/v/__VERSION__/ecrans.js" nonce="__NONCE__"></script>
<script nonce="__NONCE__">
'use strict';
const {$,esc,fmtN,fmtMs,heure,api,ajuster,hash01}=ECRAN;
ECRAN.onglets($('#nav'));
const S={hist:{sources:[],tamis:[],rem:[],rech:[],red:[],hum:[]},cpt:{tamis:0,rem:0,rech:0,red:0,hum:0},debit:{},spir:[]};
const ACT=[['sources','SOURCES','écritures / min'],['tamis','TAMIS','décisions'],['rem','REMONTÉES','faites'],['rech','RECHERCHE','questions'],['red','RÉDACTION','par l’IA'],['hum','HUMAIN','à valider']];
async function charger(){
  const [H,P,st]=await Promise.all([ECRAN.hierarchie(),api('/v1/graph/points?ns=shared'),api('/v1/stats?scope=activite')]);
  Object.assign(S,{H,P,st});
  /* les orbites : un cerveau membre par anneau, du plus gros au centre vers l'extérieur */
  const mem=[...H.cerveaux.values()].filter(c=>!c.global&&!c.commun&&c.n>0).sort((a,b)=>a.n-b.n);
  /* une bande par cerveau, de largeur proportionnelle à la racine de sa part ; le plus gros dehors */
  const poids=mem.map(c=>Math.sqrt(c.n)),pt=poids.reduce((a,b)=>a+b,0)||1;let r0=.24;
  S.orb=new Map(mem.map((c,i)=>{const w=.72*poids[i]/pt,o={c,i,R:r0+w/2,r0,r1:r0+w};r0+=w;return [c.id,o];}));
  /* chaque entrée sur son orbite, angle = son rang d'arrivée : les plus récentes au même endroit, brillantes */
  const par=new Map();for(let i=0;i<P.g;i++){const c=P.c[i]>=0?P.cerveaux[P.c[i]]:null;if(!S.orb.has(c))continue;if(!par.has(c))par.set(c,[]);par.get(c).push(P.e[i]);}
  S.pts=[];for(const [c,ids] of par){ids.sort((a,b)=>a-b);const o=S.orb.get(c),n=ids.length,pas=Math.max(1,Math.ceil(n/2500));
    for(let k=0;k<n;k+=pas)S.pts.push({o,a:-Math.PI/2+2*Math.PI*k/n*5.3,r:o.r0+(o.r1-o.r0)*hash01(ids[k]),jeune:k/n,col:o.c.coul});}
  const a=st.activite||{},serie=a.serie||[],t=st.tamis||{remontees:[]};
  S.cpt.rech=a.requetes_24h||0;S.cpt.red=serie.filter(v=>v.decision==='SYNTHESE').length;
  S.cpt.rem=t.remontees.filter(r=>r.statut==='faite').reduce((x,r)=>x+r.n,0);S.cpt.hum=t.remontees.filter(r=>r.statut==='a_valider').reduce((x,r)=>x+r.n,0);
  panneaux();acteurs();
}
function acteurs(){
  $('#acteurs').innerHTML=ACT.map(([k,n,s])=>'<div class="act"><h5>'+n+'<b>'+s+'</b></h5><canvas id="sk_'+k+'" width="200" height="48"></canvas><em id="v_'+k+'">—</em></div>').join('');
  majActeurs();
}
function majActeurs(){const v={sources:Object.values(S.debit).reduce((a,b)=>a+b,0),tamis:S.cpt.tamis,rem:S.cpt.rem,rech:S.cpt.rech,red:S.cpt.red,hum:S.cpt.hum};
  for(const [k] of ACT){const e=$('#v_'+k);if(e)e.textContent=fmtN(v[k]);ECRAN.spark($('#sk_'+k),S.hist[k],'#ff4fa3',{vide:' '});}}
function panneaux(){
  const {H,st}=S,t=st.tamis||{remontees:[]},a=st.activite||{};
  /* cerveaux : entrées par orbite */
  const c=$('#cerv'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const L=[...S.orb.values()],m=Math.max(1,...L.map(o=>o.c.n));
  L.slice(0,10).forEach((o,i)=>{const w=(c.width-120)*Math.log10(1+o.c.n)/Math.log10(1+m);x.fillStyle=o.c.coul;x.fillRect(110,8+i*19,w,12);x.fillStyle='#ccc';x.font='12px monospace';x.fillText(o.c.nom.slice(0,13),2,18+i*19);});
  /* matrice : sources × statut des remontées */
  const st2=['faite','a_valider','refusee'],srcs=[...new Set(t.remontees.map(r=>r.source))].slice(0,7),mx=Math.max(1,...t.remontees.map(r=>r.n));
  $('#mat').style.gridTemplateColumns='80px repeat(3,1fr)';
  $('#mat').innerHTML='<span></span>'+st2.map(s=>'<span style="font-size:8px;color:var(--mut)">'+s.replace('_',' ')+'</span>').join('')+srcs.map(s=>'<span style="font-size:9px">'+esc(s)+'</span>'+st2.map(k=>{const r=t.remontees.find(v=>v.source===s&&v.statut===k);const n=r?r.n:0;
    return '<i title="'+n+'" style="background:'+(n?'rgba(255,79,163,'+(.2+.8*n/mx)+')':'rgba(255,255,255,.05)')+'"></i>';}).join('')).join('')||'<div class="vide">aucune remontée encore</div>';
  /* remontées par cerveau d'arrivée : compté côté page sur l'arbre */
  const com=[...H.cerveaux.values()].filter(v=>v.commun);
  $('#rem').innerHTML=ECRAN.barres(com.map(v=>[v.nom,v.n,v.coul]),Math.max(1,...com.map(v=>v.n)));
  /* règles réelles du global */
  const r=(H.arbre&&H.arbre.global&&H.arbre.global.reglages)||{};
  $('#regles').innerHTML=['seuil d’importance pour monter : <b>'+(r.seuil??'—')+'</b>','convergence : <b>'+(r.convergence??'—')+' origines</b> sur une même clé font une fiche',
    'répétition : <b>'+(r.repetition_heures??'—')+' h</b> avant qu’un même motif remonte encore','fenêtre : <b>'+(r.fenetre_jours??'—')+' jours</b>','remontée : <b>'+(r.remontee||'—')+'</b>',
    'toujours : <b>'+esc((r.toujours||[]).join(', ')||'—')+'</b> · jamais : <b>'+esc((r.jamais||[]).join(', ')||'—')+'</b>'].map(l=>'<div>'+l+'</div>').join('');
  const serie=a.serie||[],rf=t.remontees.reduce((x,v)=>x+v.n,0),rep=(t.repetitions||[]).reduce((x,v)=>x+(v.n||0),0);
  $('#chiffres').innerHTML=[['REQUÊTES · 24 H',fmtN(a.requetes_24h)],['REMONTÉES',fmtN(rf)],['MOTIFS COMPTÉS',fmtN(rep)],['P50',fmtMs(a.ms_p50_24h)],
    ['COÛT',(st.redacteur||{}).distant?'non mesuré':'0 €'],['FICHES',fmtN(t.fiches)]].map(([k,v])=>'<div class="p"><h4>'+k+'</h4><div class="v">'+v+'</div></div>').join('');
  jauge((st.chunks||{}).pending||0,((st.chunks||{}).embedded||0)+((st.chunks||{}).pending||0));
}
function jauge(p,tot){const c=$('#jg'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const cx=110,cy=105,R=86;
  x.lineWidth=12;x.strokeStyle='rgba(255,255,255,.08)';x.beginPath();x.arc(cx,cy,R,Math.PI,2*Math.PI);x.stroke();
  const f=tot?p/tot:0;x.strokeStyle='#ff4fa3';x.beginPath();x.arc(cx,cy,R,Math.PI,Math.PI+Math.PI*Math.min(1,f));x.stroke();
  x.fillStyle='#fff';x.font='bold 22px monospace';x.textAlign='center';x.fillText(fmtN(p),cx,cy-14);x.textAlign='left';
  $('#jgS').textContent='à vectoriser sur '+fmtN(tot)+' morceaux';}
/* le disque */
function dessiner(){
  const {g,W,H}=ajuster($('#cv'));g.clearRect(0,0,W,H);const cx=W/2,cy=H*.52,RX=W*.46,RY=H*.36;
  g.globalCompositeOperation='lighter';
  /* les orbites : une ellipse par cerveau */
  if(S.orb)for(const o of S.orb.values()){g.strokeStyle=o.c.coul+'40';g.lineWidth=1;g.beginPath();g.ellipse(cx,cy+(1-o.R)**2*H*.22,RX*o.R,RY*o.R,0,0,7);g.stroke();}
  /* les entrées : plus récentes = plus brillantes */
  /* l'entonnoir : plus on va vers le noyau, plus on descend */
  if(S.pts)for(const p of S.pts){const x=cx+Math.cos(p.a)*RX*p.r,y=cy+Math.sin(p.a)*RY*p.r+(1-p.r)**2*H*.22;g.fillStyle=p.col;g.globalAlpha=.3+.7*p.jeune**2;g.fillRect(x,y,2.2,2.2);}
  g.globalAlpha=1;
  const gr=g.createRadialGradient(cx,cy,0,cx,cy,RX*.2);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.25,'rgba(255,79,163,.6)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(cx,cy,RX*.2,0,7);g.fill();
  /* une entrée arrivée : elle spirale du bord jusqu'à son orbite */
  for(let i=S.spir.length-1;i>=0;i--){const s=S.spir[i];s.t+=.012;if(s.t>=1){S.spir.splice(i,1);continue;}const r=s.r+(1.05-s.r)*(1-s.t)**2,a=s.a+(1-s.t)*3;
    const x=cx+Math.cos(a)*RX*r,y=cy+Math.sin(a)*RY*r,gg=g.createRadialGradient(x,y,0,x,y,10);gg.addColorStop(0,'#fff');gg.addColorStop(.4,s.col);gg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gg;g.beginPath();g.arc(x,y,10,0,7);g.fill();}
  g.globalCompositeOperation='source-over';
  etiquettes(W,H,cx,cy,RX,RY);requestAnimationFrame(dessiner);
}
let tE=0;function etiquettes(W,H,cx,cy,RX,RY){const n=performance.now();if(n-tE<500||!S.st)return;tE=n;const sc=$('#scene');sc.querySelectorAll('.call').forEach(e=>e.remove());
  const t=S.st.tamis||{remontees:[]},av=t.remontees.filter(r=>r.statut==='a_valider').reduce((x,r)=>x+r.n,0),serie=(S.st.activite||{}).serie||[],d=serie[0];
  const call=(h,x,y)=>{const e=document.createElement('div');e.className='call';e.innerHTML=h;e.style.left=x+'px';e.style.top=y+'px';sc.appendChild(e);};
  call('À VALIDER · '+fmtN(av)+'<small>attendent un geste humain</small>',cx+RX*.25,cy-RY*.95);
  if(d)call('DERNIÈRE QUESTION · '+esc(d.decision||'—')+'<small>'+esc(d.arret)+' · '+fmtMs(d.ms)+' · '+d.hits+' résultat(s)</small>',cx-RX*.95,cy-RY*.35);
  const big=S.orb&&[...S.orb.values()][0];if(big)call(esc(big.c.nom)+' · '+fmtN(big.c.n)+'<small>l’orbite la plus pleine</small>',cx+RX*.55,cy+RY*.6);
  call('FICHES · '+fmtN(t.fiches)+'<small>convergences entre sources</small>',cx-RX*.7,cy+RY*.75);}
ECRAN.flux({
  evenement:e=>{
    if(e.type==='ecrit'){const o=S.orb&&S.orb.get(e.cerveau);if(o&&S.spir.length<120)S.spir.push({r:o.R,a:-Math.PI/2+hash01(e.id)*.4,t:0,col:o.c.coul});ECRAN.journal($('#log'),e.source+' → '+(e.genre||''),'écrit',9);}
    else if(e.type==='tamis'){S.cpt.tamis++;if(e.decision==='remontee')S.cpt.rem++;if(e.decision==='a_valider')S.cpt.hum++;ECRAN.journal($('#log'),e.decision+(e.regle?' · '+e.regle:''),'tamis',9);}
    else if(e.type==='question'){S.cpt.rech++;ECRAN.journal($('#log'),e.route+' · '+(e.source||e.compte||'?')+' · '+e.arret+' · '+fmtMs(e.ms),'question',9);}
    majActeurs();},
  etat:d=>{S.debit=d.debit_60s||{};const tot=Object.values(S.debit).reduce((a,b)=>a+b,0);
    for(const [k,v] of [['sources',tot],['tamis',S.cpt.tamis],['rem',S.cpt.rem],['rech',S.cpt.rech],['red',S.cpt.red],['hum',S.cpt.hum]]){S.hist[k].push(v);if(S.hist[k].length>60)S.hist[k].shift();}
    $('#srcs').innerHTML=ECRAN.barres(Object.entries(S.debit).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>[k,v,S.H?ECRAN.couleurSource(S.H,k):'#ff4fa3']),Math.max(1,...Object.values(S.debit)))||'<div class="vide">aucune écriture sur 60 s</div>';
    majActeurs();jauge(d.file_vectorisation||0,((S.st&&S.st.chunks)||{}).embedded+(d.file_vectorisation||0));}
});
charger().then(()=>requestAnimationFrame(dessiner)).catch(e=>{$('#log').textContent='données illisibles : '+e.message;});
</script>
</body>
</html>
